# This rule is not used by the project hcp-nodeport-reflector itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants full permissions ('*') over reflector.bizcochillo.io.
# This role is intended for users authorized to modify roles and bindings within the cluster,
# enabling them to delegate specific permissions to other users or groups as needed.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hcp-nodeport-reflector
    app.kubernetes.io/managed-by: kustomize
  name: reflector-nodeportreflector-admin-role
rules:
- apiGroups:
  - reflector.bizcochillo.io
  resources:
  - nodeportreflectors
  verbs:
  - '*'
- apiGroups:
  - reflector.bizcochillo.io
  resources:
  - nodeportreflectors/status
  verbs:
  - get
