# This rule is not used by the project hcp-nodeport-reflector itself.
# It is provided to allow the cluster admin to help manage permissions for users.
#
# Grants read-only access to reflector.bizcochillo.io resources.
# This role is intended for users who need visibility into these resources
# without permissions to modify them. It is ideal for monitoring purposes and limited-access viewing.

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: hcp-nodeport-reflector
    app.kubernetes.io/managed-by: kustomize
  name: reflector-nodeportreflector-viewer-role
rules:
- apiGroups:
  - reflector.bizcochillo.io
  resources:
  - nodeportreflectors
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - reflector.bizcochillo.io
  resources:
  - nodeportreflectors/status
  verbs:
  - get
